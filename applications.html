<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Applications - JobTrack</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            JobTrack
        </div>

        <div class="nav-links">

            <a href="user-module.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="add-job.html">Add Job</a>
            <a href="applications.html">Applications</a>
            <a href="interview.html">Interviews</a>
            <a href="reminders.html">Reminders</a>
            <a href="#" onclick="logout()">Logout</a>

        </div>

    </nav>


    <main class="container">

        <section class="page-header">

            <div>

                <h1>My Applications</h1>

                <p>
                    View and manage your job applications.
                </p>

            </div>


            <a href="add-job.html">

                <button class="primary-btn small-btn">
                    + Add Job
                </button>

            </a>

        </section>


        <section class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Company</th>

                            <th>Job Title</th>

                            <th>Location</th>

                            <th>Date</th>

                            <th>Status</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="applicationTable">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

    <script>

        function loadApplications() {

            const user =
                JSON.parse(
                    localStorage.getItem("loggedInUser")
                );


            if (!user) {

                window.location.href = "index.html";

                return;

            }


            const applications =
                JSON.parse(
                    localStorage.getItem("applications")
                ) || [];


            const userApplications =
                applications.filter(
                    app => app.userEmail === user.email
                );


            const table =
                document.getElementById("applicationTable");


            table.innerHTML = "";


            if (userApplications.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-message">
                            No job applications found.
                        </td>
                    </tr>
                `;

                return;

            }


            userApplications.forEach(function(app) {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>${app.company}</td>

                    <td>${app.jobTitle}</td>

                    <td>${app.location}</td>

                    <td>${app.applicationDate}</td>

                    <td>
                        <span class="status-badge">
                            ${app.status}
                        </span>
                    </td>

                    <td>

                        <button
                            class="danger-btn"
                            onclick="deleteApplication(${app.id})"
                        >
                            Delete
                        </button>

                    </td>

                `;


                table.appendChild(row);

            });

        }


        function deleteApplication(id) {

            let applications =
                JSON.parse(
                    localStorage.getItem("applications")
                ) || [];


            applications =
                applications.filter(
                    app => app.id !== id
                );


            localStorage.setItem(
                "applications",
                JSON.stringify(applications)
            );


            loadApplications();

        }


        loadApplications();

    </script>

</body>

</html>
